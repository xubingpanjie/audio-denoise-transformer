<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1060" width="960" height="1060"><defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#455A64" /></marker><marker id="ah_blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1565C0" /></marker><marker id="ah_orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#E65100" /></marker><filter id="shadow" x="-5%" y="-5%" width="115%" height="115%"><feDropShadow dx="1.5" dy="2" stdDeviation="2" floodOpacity="0.15" /></filter></defs><g><rect x="0" y="0" width="960" height="42" rx="0" ry="0" fill="#37474F" stroke="none" stroke-width="1.2" /><text x="480" y="26" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#FFF" font-weight="bold">图 3-2  TransformerDenoiser 模型架构详图</text></g><g><rect x="130.0" y="60" width="440" height="44" rx="4" ry="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="74.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">输入特征  (Batch, Time, Freq)</text><text x="350.0" y="90.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">Freq ∈ {257 (STFT) | 40 (Mel) | 44 (RNNoise)}</text></g><g><text x="580.0" y="68" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#78909C">[B, T, F]</text></g><g><line x1="350" y1="104" x2="350" y2="114" stroke="#455A64" stroke-width="1.6" marker-end="url(#ah)" /></g><g><rect x="130.0" y="114" width="440" height="66" rx="4" ry="4" fill="#E1F5FE" stroke="#0277BD" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="131.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">Conv1D 频率前端  ★ 创新点 1</text><text x="350.0" y="147.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">kernel 7 (256→64) → BN+ReLU → kernel 5 (64→64) → BN+ReLU → kernel 3 (64→1)</text><text x="350.0" y="163.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">沿频率轴逐帧独立卷积 · 残差连接保留原始频谱</text></g><g><text x="580.0" y="122" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#78909C">[B×T, 1, F]  →  [B, T, F]</text></g><g><g><rect x="425.0" y="134" width="150" height="18" rx="9" ry="9" fill="#FFF" stroke="#E65100" stroke-width="1.2" /><text x="500.0" y="143.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="7" fill="#E65100" font-weight="bold">★ 创新点 1: 谐波结构感知</text></g></g><g><line x1="350" y1="180" x2="350" y2="190" stroke="#E65100" stroke-width="1.6" marker-end="url(#ah_orange)" /><text x="366" y="185.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#E65100">残差: x + Conv1D(x)</text></g><g><rect x="130.0" y="190" width="440" height="36" rx="4" ry="4" fill="#B3E5FC" stroke="#01579B" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="200.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">输入投影  Linear(F → d_model=128)</text><text x="350.0" y="216.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">若 Freq≠F (如 Mel 40维) → 先经 freq_expand 升维</text></g><g><text x="580.0" y="198" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#78909C">[B, T, 128]</text></g><g><line x1="350" y1="226" x2="350" y2="236" stroke="#455A64" stroke-width="1.6" marker-end="url(#ah)" /></g><g><rect x="130.0" y="236" width="440" height="42" rx="4" ry="4" fill="#80DEEA" stroke="#00695C" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="249.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">正弦位置编码  (Positional Encoding)</text><text x="350.0" y="265.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">PE(pos,2i)=sin(pos/10000²ⁱ/¹²⁸)    PE(pos,2i+1)=cos(pos/10000²ⁱ/¹²⁸)</text></g><g><text x="580.0" y="244" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#78909C">[B, T, 128]</text></g><g><line x1="350" y1="278" x2="350" y2="288" stroke="#455A64" stroke-width="1.6" marker-end="url(#ah)" /></g><g><rect x="110.0" y="288" width="480" height="36" rx="4" ry="4" fill="#FFF8E1" stroke="#E65100" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="306.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#222" font-weight="bold">Transformer Encoder  (×2 layers,  d_model=128,  nhead=4,  d_ff=512)</text></g><g><text x="580.0" y="296" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#78909C">[B, T, 128]</text></g><g><rect x="125.0" y="324" width="450" height="62" rx="4" ry="4" fill="#FFECB3" stroke="#F57F17" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="347.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">第 1 层 EncoderLayer</text><text x="350.0" y="363.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">Multi-Head Self-Attention (h=4)  →  Add &amp; LayerNorm  →  Feed-Forward (128→512→128)  →  Add &amp; LayerNorm</text></g><g><line x1="350" y1="386" x2="350" y2="394" stroke="#FF9800" stroke-width="1.2" marker-end="url(#ah)" /></g><g><rect x="125.0" y="394" width="450" height="62" rx="4" ry="4" fill="#FFECB3" stroke="#F57F17" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="417.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">第 2 层 EncoderLayer</text><text x="350.0" y="433.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">Multi-Head Self-Attention (h=4)  →  Add &amp; LayerNorm  →  Feed-Forward (128→512→128)  →  Add &amp; LayerNorm</text></g><g><rect x="108.0" y="286" width="484" height="172" rx="8" ry="8" fill="none" stroke="#FF9800" stroke-width="2.5" /></g><g><g><rect x="600.0" y="298" width="200" height="56" rx="3" ry="3" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.2" /><text x="700.0" y="302.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="7" fill="#222">Self-Attention 计算过程:</text><text x="700.0" y="318.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="7" fill="#222">Q,K,V = Linear(X)</text><text x="700.0" y="334.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="7" fill="#222">Score = softmax(QKᵀ/√dₖ)</text><text x="700.0" y="350.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="7" fill="#222">Output = Score · V</text></g><line x1="575.0" y1="318" x2="598.0" y2="318" stroke="#F9A825" stroke-width="1" stroke-dasharray="3,2" /></g><g><line x1="350" y1="456" x2="350" y2="466" stroke="#455A64" stroke-width="1.6" marker-end="url(#ah)" /></g><g><rect x="130.0" y="466" width="440" height="36" rx="4" ry="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="476.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">输出投影  Linear(128 → Freq)</text><text x="350.0" y="492.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222">幅度掩膜:  Freq=257    复数掩膜(探索):  Freq=514</text></g><g><text x="580.0" y="474" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#78909C">[B, T, 257]</text></g><g><line x1="350" y1="502" x2="350" y2="512" stroke="#455A64" stroke-width="1.6" marker-end="url(#ah)" /></g><g><rect x="130.0" y="512" width="440" height="36" rx="4" ry="4" fill="#C8E6C9" stroke="#1B5E20" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="530.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">激活函数    幅度掩膜: Sigmoid → 值域 [0, 1]    复数掩膜: Identity (无界)</text></g><g><line x1="350" y1="548" x2="350" y2="558" stroke="#455A64" stroke-width="1.6" marker-end="url(#ah)" /></g><g><rect x="130.0" y="558" width="440" height="48" rx="4" ry="4" fill="#A5D6A7" stroke="#1B5E20" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="574.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#222" font-weight="bold">输出掩膜  [B, T, F]  (0=噪声抑制,  1=语音保留)</text><text x="350.0" y="590.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#222">增强信号 = ISTFT ( 掩膜 × 含噪幅度 · e^{j·含噪相位} )</text></g><g><text x="580.0" y="566" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#78909C">→ 增强语音 .wav</text></g><g><g><rect x="255" y="646" width="190" height="56" rx="6" ry="6" fill="#FFF" stroke="#E65100" stroke-width="1.2" filter="url(#shadow)" /><text x="350.0" y="658.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#E65100" font-weight="bold">★ 创新点 2: 训练策略优化</text><text x="350.0" y="674.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#E65100">频域加权 L1 Loss</text><text x="350.0" y="690.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#E65100">低频权重 3×  →  高频权重 1×</text></g><line x1="350" y1="614" x2="350" y2="644" stroke="#E65100" stroke-width="1.2" marker-end="url(#ah_orange)" /></g><g><line x1="578.0" y1="72" x2="620" y2="72" stroke="#CFD8DC" stroke-width="0.8" stroke-dasharray="3,3" /><text x="630" y="72" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">支持变长序列批处理</text><text x="630" y="86" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">padding_mask 机制</text><text x="630" y="100" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">排除填充帧的梯度贡献</text></g><g><line x1="578.0" y1="128" x2="620" y2="128" stroke="#CFD8DC" stroke-width="0.8" stroke-dasharray="3,3" /><text x="630" y="128" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">三层 Conv1D 逐级精炼:</text><text x="630" y="142" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A"> 7核 → 宽频带谐波包络</text><text x="630" y="156" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A"> 5核 → 中频谐波间距</text><text x="630" y="170" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A"> 3核 → 紧邻谐波峰峰值</text><text x="630" y="184" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">残差连接防梯度退化</text></g><g><line x1="578.0" y1="203" x2="620" y2="203" stroke="#CFD8DC" stroke-width="0.8" stroke-dasharray="3,3" /><text x="630" y="203" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">若输入特征维度 ≠ 257</text><text x="630" y="217" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">(如 Mel 40维)</text><text x="630" y="231" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">先经 freq_expand 升维</text></g><g><line x1="578.0" y1="255" x2="620" y2="255" stroke="#CFD8DC" stroke-width="0.8" stroke-dasharray="3,3" /><text x="630" y="255" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">sin/cos 编码注入</text><text x="630" y="269" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">时序位置信息</text><text x="630" y="283" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">使注意力感知帧间顺序</text></g><g><line x1="578.0" y1="333" x2="620" y2="333" stroke="#CFD8DC" stroke-width="0.8" stroke-dasharray="3,3" /><text x="630" y="333" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">每层包含两个子层:</text><text x="630" y="347" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">① 多头自注意力 (h=4)</text><text x="630" y="361" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">② 前馈网络 (d_ff=512)</text><text x="630" y="375" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">各子层后: Add &amp; LayerNorm</text></g><g><line x1="578.0" y1="510" x2="620" y2="510" stroke="#CFD8DC" stroke-width="0.8" stroke-dasharray="3,3" /><text x="630" y="510" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">幅度掩膜 (本文方案)</text><text x="630" y="524" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">Sigmoid → [0,1] 约束</text><text x="630" y="538" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">与含噪幅度逐点相乘</text><text x="630" y="552" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#546E7A">复用含噪相位 iSTFT</text></g><g><text x="20" y="723" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#222" font-weight="bold">图例:</text></g><g><rect x="75" y="711" width="14" height="14" rx="2" ry="2" fill="#E3F2FD" stroke="#999" stroke-width="0.8" /><text x="95" y="721" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#555">输入/数据</text></g><g><rect x="200" y="711" width="14" height="14" rx="2" ry="2" fill="#E1F5FE" stroke="#999" stroke-width="0.8" /><text x="220" y="721" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#555">卷积处理</text></g><g><rect x="325" y="711" width="14" height="14" rx="2" ry="2" fill="#80DEEA" stroke="#999" stroke-width="0.8" /><text x="345" y="721" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#555">位置编码</text></g><g><rect x="450" y="711" width="14" height="14" rx="2" ry="2" fill="#FFF8E1" stroke="#999" stroke-width="0.8" /><text x="470" y="721" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#555">Transformer</text></g><g><rect x="575" y="711" width="14" height="14" rx="2" ry="2" fill="#FFECB3" stroke="#999" stroke-width="0.8" /><text x="595" y="721" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#555">注意力子层</text></g><g><rect x="700" y="711" width="14" height="14" rx="2" ry="2" fill="#E8F5E9" stroke="#999" stroke-width="0.8" /><text x="720" y="721" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#555">输出/掩膜</text></g></svg>