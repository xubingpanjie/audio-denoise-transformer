评价分析</text></g><g><rect x="980" y="100" width="180" height="190" rx="3" ry="3" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1.2" /><text x="1070.0" y="139.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">增强音频 vs 干净参考</text><text x="1070.0" y="155.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">↓</text><text x="1070.0" y="171.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">计算客观指标:</text><text x="1070.0" y="187.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">  · STOI (可懂度 0-1)</text><text x="1070.0" y="203.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">  · SDR (失真比 dB)</text><text x="1070.0" y="219.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">↓</text><text x="1070.0" y="235.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">绘制对比图表:</text><text x="1070.0" y="251.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="8" fill="#222">  损失曲线 + 指标柱状图</text></g><g><g><rect x="130" y="320" width="220" height="48" rx="6" ry="6" fill="#FFF" stroke="#1565C0" stroke-width="1.2" filter="url(#shadow)" /><text x="240.0" y="336.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#1565C0" font-weight="bold">Conv1D 频率前端</text><text x="240.0" y="352.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#1565C0">捕捉频谱谐波结构</text></g><line x1="240" y1="290" x2="240" y2="320" stroke="#1565C0" stroke-width="1.2" marker-end="url(#ah)" /></g><g><g><rect x="490" y="320" width="220" height="48" rx="6" ry="6" fill="#FFF" stroke="#E65100" stroke-width="1.2" filter="url(#shadow)" /><text x="600.0" y="336.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#E65100" font-weight="bold">频域加权 L1 Loss</text><text x="600.0" y="352.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#E65100">+ 余弦退火调度</text></g><line x1="600" y1="290" x2="600" y2="320" stroke="#E65100" stroke-width="1.2" marker-end="url(#ah)" /></g><g><g><rect x="850" y="320" width="220" height="48" rx="6" ry="6" fill="#FFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#shadow)" /><text x="960.0" y="336.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#2E7D32" font-weight="bold">轻量设计 ~150K 参数</text><text x="960.0" y="352.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" fill="#2E7D32">CPU 毫秒级推理</text></g><line x1="960" y1="290" x2="960" y2="320" stroke="#2E7D32" stroke-width="1.2" marker-end="url(#ah)" /></g></svg>