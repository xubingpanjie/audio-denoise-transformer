<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 880" width="680" height="880" font-family="Microsoft YaHei, SimHei, sans-serif"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#455A64" /></marker></defs><text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">图3-2 TransformerDenoiser 模型架构详图</text><g><rect x="170" y="55" width="340" height="48" rx="6" ry="6" fill="#E3F2FD" stroke="#333" stroke-width="1.5" /><text x="340.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="bold" fill="#222">输入特征  [Batch, Time, Freq]</text><text x="340.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#222">Freq ∈ {257 (STFT), 40 (Mel), 44 (RNNoise)}</text></g><g><line x1="340" y1="103" x2="340" y2="113" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" /></g><g><rect x="170" y="113" width="340" height="52" rx="6" ry="6" fill="#BBDEFB" stroke="#333" stroke-width="1.5" /><text x="340.0" y="131.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="bold" fill="#222">Conv1D 频率前端  (创新点 1)</text><text x="340.0" y="147.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#222">kernel 7→5→3  |  channels=64  |  ReLU + BatchNorm</text></g><g><line x1="340" y1="165" x2="340" y2="173" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" /></g><g><rect x="525" y="143" width="95" height="22" rx="3" ry="3" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5" /><text x="572.5" y="154.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#E65100">+ 残差连接</text></g><g><line x1="515" y1="128" x2="525" y2="155" stroke="#E65100" stroke-width="1.5" stroke-dasharray="6,4" /></g><g><rect x="170" y="173" width="340" height="44" rx="6" ry="6" fill="#90CAF9" stroke="#333" stroke-width="1.5" /><text x="340.0" y="195.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="normal" fill="#222">输入投影  Linear(Freq → d_model=128)</text></g><g><line x1="340" y1="217" x2="340" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" /></g><g><rect x="170" y="225" width="340" height="44" rx="6" ry="6" fill="#81D4FA" stroke="#333" stroke-width="1.5" /><text x="340.0" y="247.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="normal" fill="#222">正弦位置编码  PositionalEncoding(d=128, max_len=8000)</text></g><g><line x1="340" y1="269" x2="340" y2="277" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" /></g><g><rect x="150" y="277" width="380" height="44" rx="6" ry="6" fill="#FFE0B2" stroke="#333" stroke-width="1.5" /><text x="340.0" y="299.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="bold" fill="#222">Transformer Encoder (×2 layers, nhead=4)</text></g><g><rect x="170" y="321" width="340" height="40" rx="6" ry="6" fill="#FFCC80" stroke="#333" stroke-width="1.5" /><text x="340.0" y="341.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#222">第 1 层:  4-Head Self-Attention  →  LayerNorm  →  FFN(512)  →  LayerNorm</text></g><line x1="340" y1="361" x2="340" y2="367" stroke="#90A4AE" stroke-width="1.3" /><g><rect x="170" y="367" width="340" height="40" rx="6" ry="6" fill="#FFCC80" stroke="#333" stroke-width="1.5" /><text x="340.0" y="387.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#222">第 2 层:  4-Head Self-Attention  →  LayerNorm  →  FFN(512)  →  LayerNorm</text></g><g><rect x="150" y="277" width="380" height="130" rx="8" ry="8" fill="none" stroke="#FF9800" stroke-width="1.5" /><text x="340.0" y="342.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="normal" fill="#222" /></g><g><line x1="340" y1="407" x2="340" y2="415" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" /></g><g><rect x="170" y="415" width="340" height="44" rx="6" ry="6" fill="#C8E6C9" stroke="#333" stroke-width="1.5" /><text x="340.0" y="429.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="normal" fill="#222">输出投影  Linear(d_model → Freq)</text><text x="340.0" y="445.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#222">幅度掩膜: 257  |  复数掩膜 (探索): 514</text></g><g><line x1="340" y1="459" x2="340" y2="467" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" /></g><g><rect x="170" y="467" width="340" height="44" rx="6" ry="6" fill="#A5D6A7" stroke="#333" stroke-width="1.5" /><text x="340.0" y="481.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="normal" fill="#222">激活函数</text><text x="340.0" y="497.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#222">幅度掩膜: Sigmoid → [0, 1]  |  复数掩膜: Identity → ℝ</text></g><g><line x1="340" y1="511" x2="340" y2="519" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" /></g><g><rect x="170" y="519" width="340" height="48" rx="6" ry="6" fill="#81C784" stroke="#333" stroke-width="1.5" /><text x="340.0" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="bold" fill="#222">输出掩膜  [B, T, F]</text><text x="340.0" y="551.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="9" font-weight="normal" fill="#222">增强信号 = ISTFT(掩膜 × 含噪复数谱)</text></g><line x1="515" y1="88" x2="505" y2="88" stroke="#B0BEC5" stroke-width="0.8" stroke-dasharray="3,3" /><text x="520" y="73" font-size="8.5" fill="#546E7A">T: 时间帧数 (不定长, ~80-500帧)
F: 频率bin数
支持变长序列批处理 (padding mask)</text><line x1="515" y1="142" x2="505" y2="142" stroke="#B0BEC5" stroke-width="0.8" stroke-dasharray="3,3" /><text x="520" y="127" font-size="8.5" fill="#546E7A">Conv1D 沿频率轴独立处理每帧
3层卷积逐级精炼:
  · 7核 → 宽频带能量包络
  · 5核 → 中频谐波间距
  · 3核 → 紧邻谐波峰
残差连接防止梯度退化</text><line x1="515" y1="228" x2="505" y2="228" stroke="#B0BEC5" stroke-width="0.8" stroke-dasharray="3,3" /><text x="520" y="213" font-size="8.5" fill="#546E7A">将任意维度特征映射至
d_model=128 统一空间</text><line x1="515" y1="276" x2="505" y2="276" stroke="#B0BEC5" stroke-width="0.8" stroke-dasharray="3,3" /><text x="520" y="261" font-size="8.5" fill="#546E7A">sin/cos编码注入时序位置信息
使无顺序感的自注意力
获得帧间先后关系</text><line x1="515" y1="328" x2="505" y2="328" stroke="#B0BEC5" stroke-width="0.8" stroke-dasharray="3,3" /><text x="520" y="313" font-size="8.5" fill="#546E7A">核心计算单元 (×2):
多头自注意力 → 全局帧依赖
  · 每帧可关注任意距离帧
  · 4个子空间并行学习
FFN → 非线性增强表达
LayerNorm → 稳定训练</text><line x1="515" y1="475" x2="505" y2="475" stroke="#B0BEC5" stroke-width="0.8" stroke-dasharray="3,3" /><text x="520" y="460" font-size="8.5" fill="#546E7A">掩膜值 ∈ [0,1]
0 = 纯噪声 (抑制)
1 = 纯语音 (保留)
→ 与含噪幅度逐点相乘</text><text x="30" y="862" font-size="9" font-weight="bold">图例:</text><rect x="70" y="850" width="16" height="12" rx="3" fill="#E3F2FD" stroke="#999" stroke-width="0.8" /><text x="90" y="860" font-size="8" fill="#555">输入/提取</text><rect x="170" y="850" width="16" height="12" rx="3" fill="#BBDEFB" stroke="#999" stroke-width="0.8" /><text x="190" y="860" font-size="8" fill="#555">卷积处理</text><rect x="270" y="850" width="16" height="12" rx="3" fill="#90CAF9" stroke="#999" stroke-width="0.8" /><text x="290" y="860" font-size="8" fill="#555">投影/位置编码</text><rect x="370" y="850" width="16" height="12" rx="3" fill="#FFE0B2" stroke="#999" stroke-width="0.8" /><text x="390" y="860" font-size="8" fill="#555">Transformer Encoder</text><rect x="470" y="850" width="16" height="12" rx="3" fill="#FFCC80" stroke="#999" stroke-width="0.8" /><text x="490" y="860" font-size="8" fill="#555">注意力/FFN</text><rect x="570" y="850" width="16" height="12" rx="3" fill="#81C784" stroke="#999" stroke-width="0.8" /><text x="590" y="860" font-size="8" fill="#555">输出/掩膜</text></svg>