<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"><defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#455A64" /></marker><marker id="ah_blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1565C0" /></marker><marker id="ah_orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#E65100" /></marker><filter id="shadow" x="-5%" y="-5%" width="115%" height="115%"><feDropShadow dx="1.5" dy="2" stdDeviation="2" floodOpacity="0.15" /></filter></defs><g><rect x="0" y="0" width="1200" height="42" rx="0" ry="0" fill="#37474F" stroke="none" stroke-width="1.2" /><text x="600" y="26" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#FFF" font-weight="bold">图 3-1  系统整体流水线架构 — 六阶段模块化设计</text></g><g><rect x="20" y="56" width="180" height="36" rx="3" ry="3" fill="#C5CAE9" stroke="#546E7A" stroke-width="1.2" filter="url(#shadow)" /><text x="110.0" y="74.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#222" font-weight="bold">阶段一
